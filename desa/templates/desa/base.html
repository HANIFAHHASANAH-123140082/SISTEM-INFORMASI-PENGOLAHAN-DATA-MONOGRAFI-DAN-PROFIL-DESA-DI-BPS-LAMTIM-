<!DOCTYPE html>
{% load static %}
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sistem Monografi Desa - BPS Kabupaten Lampung Timur</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        :root{
            --bps-blue:#1D5A96;
            --bps-blue-deep:#163F6B;
            --bps-blue-pale:#EAF2FA;
            --bps-orange:#D98F3D;
            --bps-orange-deep:#B36F22;
            --bps-green-bg:#EAF3EE;
            --bps-green-text:#1C5C42;
            --bps-gray-bg:#EDEEEF;
            --bps-gray-text:#585F66;
            --bps-red:#A32D2D;
            --bps-bg:#EFF3F7;
            --bps-border:#DCE4EC;
            --bps-text:#2B3038;
            --bps-text-soft:#5B6470;

            --font-serif:'Source Serif 4', serif;
            --font-sans:'Inter', sans-serif;
        }

        body{
            font-family:var(--font-sans);
            background:var(--bps-bg);
            color:var(--bps-text);
        }

        /* =======================================================
                            HEADER
        ======================================================== */

        .site-header{
            background:var(--bps-blue);
            padding:18px 0;
        }

        .header-inner{
            display:flex;
            justify-content:space-between;
            align-items:center;
            text-decoration:none;
            width:100%;
        }

        .brand{
            display:flex;
            flex-direction:column;
        }

        .brand-title{
            font-family:var(--font-serif);
            font-size:26px;
            font-weight:700;
            color:#fff;
            margin:0;
            line-height:1.25;
            letter-spacing:.01em;
        }

        .brand-subtitle{
            margin-top:6px;
            margin-bottom:0;
            color:rgba(255,255,255,.9);
            font-size:13.5px;
            font-weight:500;
            text-transform:uppercase;
            letter-spacing:.09em;
        }

        .logo-group{
            display:flex;
            align-items:center;
            gap:22px;
        }

        .logo-img{
            width:auto;
            object-fit:contain;
            display:block;
        }

        .logo-img-lamtim{
            height:78px;
            width:auto;
            object-fit:contain;
        }

        .logo-img-bps{
            height:55px;
            width:auto;
            object-fit:contain;
        }

        .header-rule-thin{
            height:3px;
            background:var(--bps-orange);
        }

        /* =======================================================
                            CONTENT
        ======================================================== */

        .page-card{
            background:#fff;
            border:1px solid var(--bps-border);
            border-radius:12px;
            padding:2rem;
            box-shadow:0 1px 3px rgba(51,70,91,.08);
        }

        .page-title{
            font-family:var(--font-serif);
            color:var(--bps-blue-deep);
            font-weight:700;
            font-size:1.6rem;
            letter-spacing:-.01em;
            margin-bottom:.4rem;
        }

        .page-subtitle{
            font-size:.9rem;
            color:var(--bps-text-soft);
            margin-bottom:1.5rem;
        }

        .btn-bps-primary{
            background:var(--bps-blue);
            border-color:var(--bps-blue);
            color:#fff;
            font-weight:500;
        }

        .btn-bps-primary:hover{
            background:var(--bps-blue-deep);
            border-color:var(--bps-blue-deep);
            color:#fff;
        }

        .btn-bps-accent{
            background:var(--bps-orange);
            border-color:var(--bps-orange);
            color:#fff;
            font-weight:500;
        }

        .btn-bps-accent:hover{
            background:var(--bps-orange-deep);
            border-color:var(--bps-orange-deep);
        }

        .btn-bps-danger{
            background:#fff;
            border-color:var(--bps-red);
            color:var(--bps-red);
            font-weight:500;
        }

        .btn-bps-danger:hover{
            background:var(--bps-red);
            color:#fff;
        }

        table.table-bps thead th{
            background-color:var(--bps-blue) !important;
            color:#fff !important;
            text-align:center;
            vertical-align:middle;
            font-weight:600;
            border-color:var(--bps-blue);
        }

        table.table-bps tbody td{
            vertical-align:middle;
        }

        table.table-bps tbody tr:hover{
            background:var(--bps-blue-pale);
        }

        .badge-kelengkapan{
            font-size:.78rem;
            padding:4px 10px;
            border-radius:20px;
        }

        .badge-kelengkapan.lengkap{
            background:var(--bps-green-bg);
            color:var(--bps-green-text);
        }

        .badge-kelengkapan.kurang{
            background:var(--bps-gray-bg);
            color:var(--bps-gray-text);
        }

        .aksi-icon{
            font-size:1.05rem;
            margin-right:10px;
            text-decoration:none;
        }

        .icon-edit{
            color:var(--bps-blue);
        }

        .icon-file{
            color:var(--bps-orange);
        }

        .icon-hapus{
            color:var(--bps-red);
        }

        a{
            color:var(--bps-orange-deep);
        }

        .form-control:focus{
            border-color:var(--bps-blue);
            box-shadow:0 0 0 .2rem rgba(29,90,150,.18);
        }

        /* =======================================================
                        RESPONSIVE
        ======================================================== */

        @media (max-width:768px){

            .header-inner{
                flex-direction:column;
                gap:15px;
                text-align:center;
            }

            .brand-title{
                font-size:22px;
            }

            .brand-subtitle{
                font-size:12px;
            }

            .logo-img-lamtim{
                height:46px;
            }

            .logo-img-bps{
                height:50px;
            }

        }

    </style>

</head>

<body>

<header class="site-header">

    <div class="container">

        <a href="{% url 'daftar_desa' %}" class="header-inner">

            <div class="brand">

                <h1 class="brand-title">
                    Sistem Informasi Monografi dan Profil Desa
                </h1>

                <p class="brand-subtitle">
                    BADAN PUSAT STATISTIK KABUPATEN LAMPUNG TIMUR
                </p>

            </div>

            <div class="logo-group">

                <img
                    src="{% static 'desa/logo_lampung_timur.png' %}"
                    alt="Logo Kabupaten Lampung Timur"
                    class="logo-img logo-img-lamtim">

                <img
                    src="{% static 'desa/logo_bps.png' %}"
                    alt="Logo BPS"
                    class="logo-img logo-img-bps">

            </div>

        </a>

    </div>

</header>

<div class="header-rule-thin"></div>

<div class="container pt-4 pb-5">

    {% block content %}

    {% endblock %}

</div>

</body>
</html>
